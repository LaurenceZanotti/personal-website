services:
  personal-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-website:latest
    container_name: personal-website-app

    ports:
      - "127.0.0.1:3000:3000"

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # The standalone server only writes to /tmp and its own build-cache dir.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    restart: unless-stopped

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
