worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;

    # Keep every writable path under /tmp so the container can run
    # read-only as a non-root user.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;
    keepalive_timeout 30;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    server {
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # Hashed build assets never change under the same name.
        location /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Static export: /about -> /about.html. HTML is re-validated on every
        # request so a redeploy lands immediately.
        location / {
            add_header Cache-Control "public, max-age=0, must-revalidate";
            try_files $uri $uri.html $uri/index.html =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
